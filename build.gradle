// Valkey keys for any module: names <service>:<kind>:<id> inside the app's ACL prefix, and counters
// and limits that expire with their window.
plugins {
    alias(libs.plugins.conventions.library)
    alias(libs.plugins.conventions.integration.test)
}

dependencies {
    api platform(libs.spring.boot.bom)
    runtimeOnly libs.config4j // loads the files in META-INF/spring/…LibraryDefaults.imports
    api libs.error4j
    implementation libs.starter.data.redis // consumers use ValkeyKeys, never Redis itself
    implementation libs.spring.boot.autoconfigure
    implementation libs.starter.validation // the properties are checked at startup

    testImplementation testFixtures(libs.error4j)

    integrationTestImplementation libs.testcontainers.core
    integrationTestImplementation libs.testcontainers.junit
}
